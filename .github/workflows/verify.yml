name: Verify suite catalog

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pinned suite source
        uses: actions/checkout@v4
      - name: Check out the five RadioCore product repositories
        run: |
          git submodule sync -- firmware/rc52-companion firmware/rc52-headless-companion firmware/rc52-repeater firmware/rcc6-companion firmware/rcc6-mqtt-repeater
          git submodule update --init --depth 1 -- firmware/rc52-companion firmware/rc52-headless-companion firmware/rc52-repeater firmware/rcc6-companion firmware/rcc6-mqtt-repeater
      - name: Validate catalog and submodule pins
        run: python scripts/verify_catalog.py
